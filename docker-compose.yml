services:
  postgres:
    image: postgres:16
    container_name: reimbursement-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reimbursements_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d reimbursements_db']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  backend:
    image: oven/bun:1
    container_name: reimbursement-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3333:3333'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reimbursements_db
      JWT_SECRET: dev-secret-change-me
      HTTP_PORT: 3333
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "bun install && bunx prisma migrate deploy && bunx prisma generate && bun run seed && bun run dev"

  prisma-studio:
    image: oven/bun:1
    container_name: reimbursement-prisma-studio
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5555:5555'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reimbursements_db
    volumes:
      - ./backend:/app
      - prisma_studio_node_modules:/app/node_modules
    command: sh -c "bun install && bunx prisma studio --port 5555 --browser none"

volumes:
  postgres_data:
  backend_node_modules:
  prisma_studio_node_modules:
